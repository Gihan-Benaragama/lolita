services:
  - type: web
    name: lolita
    env: docker
    plan: free
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://lolita-53ji.onrender.com
      - key: DB_CONNECTION
        value: sqlite
